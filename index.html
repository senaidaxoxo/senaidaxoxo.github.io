<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Morning Brief</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .brief-body h1 {
      font-size: 17px; font-weight: 500; color: var(--accent);
      margin: 28px 0 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border); letter-spacing: -0.01em;
    }
    .brief-body h1:first-child { margin-top: 24px; }
    .brief-body h2 {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin: 22px 0 10px;
    }
    .brief-body p { margin-bottom: 10px; }
    .brief-body ul, .brief-body ol { list-style: none; padding: 0; margin-bottom: 12px; }
    .brief-body li {
      padding: 9px 0 9px 16px; border-bottom: 1px solid var(--border);
      position: relative;
    }
    .brief-body li:last-child { border-bottom: none; }
    .brief-body ul li::before {
      content: ''; position: absolute; left: 0; top: 17px;
      width: 5px; height: 5px; border-radius: 50%; background: var(--dot);
    }
    .brief-body input[type="checkbox"] {
      accent-color: var(--dot); width: 15px; height: 15px;
      margin-right: 8px; vertical-align: -2px;
    }
    .brief-body li:has(input[type="checkbox"]) { padding-left: 0; }
    .brief-body li:has(input[type="checkbox"])::before { display: none; }
    .brief-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .brief-body th {
      text-align: left; font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      padding: 6px 8px; border-bottom: 1px solid var(--border);
    }
    .brief-body td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .brief-body tr:last-child td { border-bottom: none; }
    .brief-body strong { font-weight: 600; }
    .brief-body em { color: var(--accent); font-style: italic; }
    .brief-body blockquote {
      border-left: 2px solid var(--accent); padding: 12px 16px;
      margin: 20px 0; background: var(--surface); border-radius: 0 8px 8px 0;
    }
    .brief-body blockquote p { color: var(--accent); font-style: italic; font-weight: 300; margin: 0; }
    .brief-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #c8a97e;
      --dot: #3d7a5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
    }

    body {
      padding: env(safe-area-inset-top, 44px) 0 env(safe-area-inset-bottom, 24px);
    }

    .header {
      padding: 52px 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .date-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .date-main {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .date-main span { color: var(--accent); font-weight: 400; }

    .generated-at {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .greeting {
      padding: 28px 24px 0;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    section { margin: 28px 24px 0; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .focus-list { list-style: none; }

    .focus-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      line-height: 1.45;
    }

    .focus-list li:last-child { border-bottom: none; }

    .focus-list li::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dot);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .reminder-text {
      font-size: 15px;
      line-height: 1.55;
      color: #aaa;
    }

    .thought-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .thought-text {
      font-size: 16px;
      font-weight: 300;
      line-height: 1.5;
      color: var(--accent);
      font-style: italic;
    }

    .footer {
      margin: 40px 24px 0;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-text { font-size: 11px; color: var(--muted); }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .refresh-btn:active { background: var(--surface); }

    .error-state {
      margin: 40px 24px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }

    .loading {
      margin: 80px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="date-label">Morning Brief</div>
    <div class="date-main" id="date-display">—</div>
    <div class="generated-at" id="generated-at"></div>
  </div>

  <div id="content" style="padding:0 20px 60px">
    <div class="loading">Loading…</div>
  </div>

  <script>
    marked.setOptions({ breaks: true, gfm: true });

    function formatDate(str) {
      const d = new Date(str + 'T12:00:00');
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${days[d.getDay()]}, <span>${months[d.getMonth()]} ${d.getDate()}</span>`;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? '' : `Updated ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}`;
    }

    function render(data) {
      document.getElementById('date-display').innerHTML = formatDate(data.date);
      document.getElementById('generated-at').textContent = formatTime(data.generated_at);
      document.getElementById('content').innerHTML =
        `<div class="brief-body">${marked.parse(data.markdown || '')}</div>
         <div class="footer" style="margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between">
           <span>senaidaxoxo · 4AM ET</span>
           <button class="refresh-btn" onclick="load()">↻</button>
         </div>`;
    }

    async function load() {
      try {
        const r = await fetch('briefing.json?t=' + Date.now());
        if (!r.ok) throw new Error();
        render(await r.json());
      } catch {
        document.getElementById('content').innerHTML =
          '<div class="loading">No briefing yet. Updates 4AM ET.</div>';
      }
    }

    load();
  </script>
</body>
</html>
